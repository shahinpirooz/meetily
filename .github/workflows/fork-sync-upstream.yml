# Fork only: keeps this fork current with upstream Meetily.
#
# Weekly (and on demand) it:
#   1. fast-forwards "main" to upstream/main (main is a clean mirror)
#   2. merges main into "rich-export" on a sync branch and runs the fork's tests
#   3. opens a pull request into rich-export (or updates the open one)
# A clean, green PR can be merged with one click. If the merge conflicts or a
# test fails, the PR says so and you finish it locally with
# scripts/fork/sync-upstream.sh.
#
# Needs a repository secret SYNC_TOKEN: a fine-grained personal access token
# for this repo with Contents, Pull requests and Workflows = Read and write.
# (The default GITHUB_TOKEN can't push commits that touch .github/workflows,
# and upstream changes its workflows regularly.)
name: "Fork: sync upstream"

on:
  schedule:
    - cron: "17 6 * * 1"   # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: fork-sync-upstream

env:
  UPSTREAM: https://github.com/Zackriya-Solutions/meetily.git
  FEATURE_BRANCH: rich-export

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Fast-forward main to upstream
        id: ff
        run: |
          git config user.name "fork-sync-bot"
          git config user.email "fork-sync-bot@users.noreply.github.com"
          git remote add upstream "$UPSTREAM"
          git fetch upstream main --tags
          git checkout main
          before=$(git rev-parse HEAD)
          git merge --ff-only upstream/main
          git push origin main --tags
          echo "changed=$([ "$before" != "$(git rev-parse HEAD)" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "version=$(git describe --tags --abbrev=0 2>/dev/null || git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Merge main into the feature branch
        id: merge
        run: |
          git fetch origin "$FEATURE_BRANCH"
          if git merge-base --is-ancestor main "origin/$FEATURE_BRANCH"; then
            echo "Feature branch already contains upstream."; echo "needed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "needed=true" >> "$GITHUB_OUTPUT"
          SYNC="sync/upstream-${{ steps.ff.outputs.version }}"
          echo "branch=$SYNC" >> "$GITHUB_OUTPUT"
          git checkout -B "$SYNC" "origin/$FEATURE_BRANCH"
          if git merge --no-edit main; then
            echo "conflicts=" >> "$GITHUB_OUTPUT"
          else
            files=$(git diff --name-only --diff-filter=U | tr '\n' ' ')
            echo "conflicts=$files" >> "$GITHUB_OUTPUT"
            git merge --abort
            git checkout -B "$SYNC" main   # PR shows upstream changes; resolve locally
          fi

      - uses: actions/setup-node@v4
        if: steps.merge.outputs.needed == 'true' && steps.merge.outputs.conflicts == ''
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2
        if: steps.merge.outputs.needed == 'true' && steps.merge.outputs.conflicts == ''
        with:
          bun-version: 1.3.14

      - name: Run fork tests
        id: tests
        if: steps.merge.outputs.needed == 'true' && steps.merge.outputs.conflicts == ''
        continue-on-error: true
        run: |
          npm install -g pnpm@9.15.9
          set +e
          scripts/fork/test-fork.sh > /tmp/test.log 2>&1
          rc=$?
          cat /tmp/test.log
          echo "passed=$([ $rc -eq 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Open or update the pull request
        if: steps.merge.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          SYNC="${{ steps.merge.outputs.branch }}"
          git push -f origin "$SYNC"
          {
            echo "Upstream Meetily **${{ steps.ff.outputs.version }}** merged into \`$FEATURE_BRANCH\`."
            echo
            if [ -n "${{ steps.merge.outputs.conflicts }}" ]; then
              echo "### Merge conflicts, finish locally"
              echo "Files: \`${{ steps.merge.outputs.conflicts }}\`"
              echo
              echo '```'
              echo "git checkout $FEATURE_BRANCH && scripts/fork/sync-upstream.sh"
              echo '```'
            elif [ "${{ steps.tests.outputs.passed }}" = "true" ]; then
              echo "### Fork tests passed"
            else
              echo "### Fork tests FAILED"
              echo '```'; tail -40 /tmp/test.log; echo '```'
            fi
          } > /tmp/body.md
          existing=$(gh pr list --base "$FEATURE_BRANCH" --head "$SYNC" --json number -q '.[0].number')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file /tmp/body.md
          else
            gh pr create --base "$FEATURE_BRANCH" --head "$SYNC" \
              --title "Sync upstream Meetily ${{ steps.ff.outputs.version }}" --body-file /tmp/body.md
          fi
